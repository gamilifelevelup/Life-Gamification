<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Your Email - Hero Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .confirmation-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .confirmation-panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 30px 60px rgba(5, 12, 35, 0.45);
    }
    .success-icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      animation: scaleIn 0.5s ease;
    }
    @keyframes scaleIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .loading-spinner {
      border: 3px solid rgba(124, 92, 255, 0.2);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 2rem auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="confirmation-container">
    <div class="confirmation-panel">
      <!-- Loading State -->
      <div id="loading-state">
        <div class="loading-spinner"></div>
        <h2>Confirming your email...</h2>
        <p class="panel-subtitle">Please wait while we verify your account.</p>
      </div>

      <!-- Success State -->
      <div id="success-state" style="display: none;">
        <div class="success-icon">✅</div>
        <h2>Email Confirmed!</h2>
        <p class="panel-subtitle">Your account has been successfully verified. You can now continue your hero journey!</p>
        <button id="continue-btn" style="margin-top: 2rem;">Continue to App</button>
      </div>

      <!-- Error State -->
      <div id="error-state" style="display: none;">
        <div class="success-icon" style="color: var(--danger);">❌</div>
        <h2>Confirmation Failed</h2>
        <p class="panel-subtitle" id="error-message">There was an error confirming your email. The link may have expired or already been used.</p>
        <button id="resend-btn" style="margin-top: 2rem; margin-right: 1rem;">Resend Confirmation</button>
        <button id="login-btn" style="margin-top: 2rem; background: transparent; border: 1px solid var(--panel-border);">Go to Login</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // Wait for Supabase to be ready
    function waitForSupabase() {
      return new Promise((resolve) => {
        if (supabaseClient) {
          resolve(supabaseClient);
          return;
        }
        const checkInterval = setInterval(() => {
          if (supabaseClient) {
            clearInterval(checkInterval);
            resolve(supabaseClient);
          }
        }, 100);
        setTimeout(() => {
          clearInterval(checkInterval);
          resolve(null);
        }, 5000);
      });
    }

    // Handle email confirmation
    async function confirmEmail() {
      const client = await waitForSupabase();
      if (!client) {
        showError('Supabase not available. Please try again later.');
        return;
      }

      try {
        // Supabase email confirmation links typically contain tokens in the URL hash (fragment)
        // The format is: #access_token=...&refresh_token=...&type=...
        const hash = window.location.hash;
        
        if (hash && hash.length > 1) {
          // Parse hash parameters
          const hashParams = new URLSearchParams(hash.substring(1));
          const accessToken = hashParams.get('access_token');
          const refreshToken = hashParams.get('refresh_token');
          const type = hashParams.get('type');

          if (accessToken && refreshToken && type === 'signup') {
            // Set session with the tokens from the confirmation link
            const { data, error } = await client.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken
            });

            if (error) {
              // Check for common errors
              if (error.message.includes('expired') || error.message.includes('invalid')) {
                throw new Error('This confirmation link has expired or is invalid. Please request a new confirmation email.');
              } else if (error.message.includes('already')) {
                throw new Error('This email has already been confirmed. You can log in now.');
              }
              throw error;
            }

            // Success - user is now confirmed and logged in
            if (data.user && data.session) {
              showSuccess();
              return;
            }
          }
        }

        // Alternative: Check query parameters (for custom implementations)
        const urlParams = new URLSearchParams(window.location.search);
        const tokenHash = urlParams.get('token_hash');
        const queryType = urlParams.get('type');

        if (tokenHash && queryType === 'signup') {
          // Try verifyOtp method (less common for email confirmation)
          const { data, error } = await client.auth.verifyOtp({
            token_hash: tokenHash,
            type: 'signup'
          });

          if (error) throw error;
          if (data.user) {
            showSuccess();
            return;
          }
        }

        // Check if user is already logged in (might have confirmed already)
        const { data: { session } } = await client.auth.getSession();
        if (session && session.user && session.user.email_confirmed_at) {
          showSuccess();
          return;
        }

        // No valid confirmation tokens found
        showError('Invalid confirmation link. Please check your email for the correct confirmation link, or the link may have expired.');
        
      } catch (error) {
        console.error('Confirmation error:', error);
        
        // Provide user-friendly error messages
        let errorMessage = 'Failed to confirm email. ';
        
        if (error.message) {
          if (error.message.includes('expired')) {
            errorMessage = 'This confirmation link has expired. Please request a new confirmation email.';
          } else if (error.message.includes('already') || error.message.includes('confirmed')) {
            errorMessage = 'This email has already been confirmed. You can log in now.';
          } else if (error.message.includes('invalid')) {
            errorMessage = 'This confirmation link is invalid. Please check your email for the correct link.';
          } else {
            errorMessage += error.message;
          }
        } else {
          errorMessage += 'Please try again or contact support.';
        }
        
        showError(errorMessage);
      }
    }

    // Show success state
    function showSuccess() {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('error-state').style.display = 'none';
      document.getElementById('success-state').style.display = 'block';

      // Auto-redirect after 3 seconds
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 3000);
    }

    // Show error state
    function showError(message) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('success-state').style.display = 'none';
      document.getElementById('error-state').style.display = 'block';
      document.getElementById('error-message').textContent = message;
    }

    // Continue button
    document.getElementById('continue-btn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // Resend confirmation
    document.getElementById('resend-btn').addEventListener('click', async () => {
      // Get email from URL or prompt
      const email = prompt('Please enter your email address to resend confirmation:');
      if (!email) return;

      const client = await waitForSupabase();
      if (!client) return;

      try {
        const { error } = await client.auth.resend({
          type: 'signup',
          email: email,
          options: {
            emailRedirectTo: window.location.origin + '/confirm.html'
          }
        });

        if (error) throw error;
        alert('Confirmation email sent! Please check your inbox.');
      } catch (error) {
        alert('Failed to send confirmation email: ' + error.message);
      }
    });

    // Login button
    document.getElementById('login-btn').addEventListener('click', () => {
      window.location.href = 'index.html#auth';
    });

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', async () => {
      // Small delay to show loading state
      setTimeout(confirmEmail, 500);
    });
  </script>
</body>
</html>
